<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <form method="post" action="http://172.30.18.224:3000/" method="post">
        <h2>Formulario de alta de usuario</h2>
        <table>
            <th>

            </th>
            <tr>
                <td colspan="2" class="centro"><label for="usuario"><b>Identificador de nuevo usuario</b></label>
                    <input type="text" id="usuario" name="usuario" value="usu_12345" readonly
                        title="Identificador aignado automáticamente (solo lextura)">
                </td>
            </tr>
            <tr>
                <td><label for="nombre"><b>Nombre:</b></label>
                    <input type="text" id="nombre" name="nombre" title="Escriba su nombre" required>
                </td>
                <td><label for="apellidos"><b>Apellidos:</b></label>
                    <input type="text" id="apellidos" name="apellidos" title="Escriba sus apellidos">
                </td>
            </tr>
            <tr>
                <td> <label for="password"><b>Contraseña:</b></label>
                    <input type="password" id="password" name="password" title="Escriba su contraseña" required>
                </td>
                <td><label for="password2"><b>Confirmar contraseña:</b></label>
                    <input type="password" id="password2" name="password2" title="Confirme su contraseña">
                </td>
            </tr>
            <tr>
                <td> <label for="codigo"><b>Código promocional</b></label>
                    <input type="codigo" id="codigo" name="codigo" disabled>
                </td>
            </tr>
            <tr>
                <td><label for="email"><b>E-mail:</b></label>
                    <input type="email" id="email" name="email" size="60"
                        title="Escriba su dirección de correo electrónico" required>
                </td>
            </tr>
            <tr>
                <td>
                    <p><b>Sexo:</b></p>
                </td>
                <td>
                    <input type="radio" id="hombre" name="sexo" value="hombre" title="Seleccione Hombre">
                    <label for="hombre">Hombre</label>
                    <!--Si se selecciona mujer como en el ejemplo, simplemente poner checked en el input siguiente-->
                    <input type="radio" id="mujer" name="sexo" value="mujer" title="Seleccione Mujer">
                    <label for="mujer">Mujer</label>
                </td>
            </tr>
            <tr>
                <td><b>Aficiones:</b></td>
                <td>
                    <input type="checkbox" id="deporte" name="aficiones" value="deporte"
                        title="Marque si le gusta el deporte">
                    <label for="deporte">Deportes</label><br>
                    <!--Si selecciona lectura como en el ejemplo, simplemente poner checked en el input siguiente-->
                    <input type="checkbox" id="lectura" name="aficiones" value="lectura"
                        title="Marque si le gusta la lectura">
                    <label for="lectura">Lectura</label><br>
                    <input type="checkbox" id="cine" name="aficiones" value="cine" title="Marque si le gusta el cine">
                    <label for="cine">Cine</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pais" name="pais"><b>País:</b></label>
                </td>
                <td>
                    <select id="pais" name="pais" title="Seleccione su país">
                        <option value="espana">España</option>
                        <option value="francia">Francia</option>
                        <option value="portugal">Portugal</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="foto"><b>Subir su foto:</b></label></td>
                <td>
                    <input type="file" id="foto" name="foto" title="Selecicone una foto de su equipo">
                </td>
            </tr>
            <tr>
                <td><label for="comentarios"><b>Comentarios personales:</b></label></td>
                <td>
                    <textarea id="commentarios" name="comentarios" cols="40" rows="5"
                        placeholder="Escriba aquí sus comentarios"
                        title="Escriba aquí sus comentarios personales"></textarea>
                </td>
            </tr>
            <tr>
                <td class="centro">
                    <input type="reset" value="Reiniciar" title="Borra todos los datos del formulario">
                </td>
                <td class="centro">
                    <input type="submit" value="Enviar" title="Envía el formulario">
                </td>
            </tr>


        </table>

    </form>

</body>

</html>
